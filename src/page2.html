<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../src/output.css">
</head>
<body class="bg-[black] text-white">
  <header class="max-w-[1200px] m-auto flex py-[20px] justify-between items-center">
    <img src="../Logo.png" alt="">
    <nav class="flex text-[20px] gap-[30px] hidden lg:flex">
      <a class="block" href="../index.html">Home</a>
      <a class="block" href="./page1.html">Services</a>
      <a class="block" href="./page3.html">Careers</a>
    </nav>
    <button class="bg-[#0011ff] text-[20px] py-[10px] px-[30px] hidden lg:block rounded-2xl">Contact</button>
    <div class="icon  lg:hidden text-4xl">=</div>
  </header>
  <div class="max-w-[1200px] m-auto px-4 mb-[50px]">
    <div class="relative bg-[#0f0f0f] rounded-3xl overflow-hidden">
      <div class="relative flex flex-col lg:flex-row items-center justify-between p-8 lg:p-14 gap-10">
        <div class="w-full lg:w-1/2">
          <h2 class="text-2xl lg:text-3xl font-semibold leading-snug mb-6">Build the Future with Us</h2>
          <p class="text-gray-400 text-sm mb-[50px] max-w-[520px]">We’re a team of builders, thinkers, and explorers
            using AI, machine learning, and blockchain to solve meaningful problems.</p>
          <button class="bg-[#0011ff] text-[20px] py-[10px] px-[30px] hidden lg:block rounded-2xl">Explore Open
            Positions</button>
        </div>
        <div class="w-full lg:w-1/2 flex justify-center lg:justify-end relative">
          <img src="../calogo1 2.png" alt="" class="max-w-[350px] w-full">
        </div>
      </div>
    </div>
  </div>
  <div class="w-full bg-[#0f1115] py-6 px-4">
    <div class="max-w-7xl mx-auto">
      <div class="w-full  rounded-2xl p-4 flex flex-col lg:flex-row gap-4 lg:items-center">
        <div class="w-full lg:w-auto min-w-[180px]">
          <select class="w-full bg-[#1c2128] text-gray-300 text-sm rounded-full px-2 py-3 outline-none ">
            <option>Departments</option>
          </select>
        </div>
        <div class="w-full lg:w-auto min-w-[160px]">
          <select class="w-full bg-[#1c2128] text-gray-300 text-sm rounded-full px-4 py-3 outline-none ">
            <option>Experience</option>
          </select>
        </div>
        <div class="w-full lg:w-auto min-w-[150px]">
          <select class="w-full bg-[#1c2128] text-gray-300 text-sm rounded-full px-4 py-3 outline-none ">
            <option>Job Type</option>
          </select>
        </div>
        <div class="w-full lg:w-auto min-w-[170px]">
          <select class="w-full bg-[#1c2128] text-gray-300 text-sm rounded-full px-4 py-3 outline-none ">
            <option>Workplace Type</option>
          </select>
        </div>
        <div class="flex items-center bg-[#1c2128] rounded-full px-4 py-3 w-full lg:flex-1">
          <input type="text" placeholder="Search by keywords..."
            class="bg-transparent outline-none text-sm text-gray-300 placeholder-gray-500 w-full">
          <button class="ml-3 bg-blue-600  rounded-full px-4 py-2 text-sm text-white">Search</button>
        </div>
      </div>
    </div>
  </div>
  
</body>
</html>
